<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>FreeDNS Prototype</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 40px; }
      input, button { padding: 8px; font-size: 16px; }
      .record { margin-top: 12px; }
    </style>
  </head>
  <body>
    <h1>FreeDNS Prototype</h1>
    <p>Search availability (mock)</p>
    <input id="domain" placeholder="example.com" />
    <button onclick="search()">Search</button>
    <div id="result"></div>

    <div id="register" style="margin-top:20px; display:none">
      <h3>Register</h3>
      <input id="email" placeholder="owner email" />
      <button onclick="register()">Register (mock)</button>
    </div>

    <hr />
    <h3>Registered domains</h3>
    <button onclick="loadDomains()">Refresh</button>
    <ul id="domains"></ul>

    <script>
      let lastDomain = '';
      async function search(){
        const d = document.getElementById('domain').value.trim();
        if(!d) return alert('enter domain');
        lastDomain = d;
        const res = await fetch('/api/search?domain=' + encodeURIComponent(d));
        const j = await res.json();
        document.getElementById('result').innerText = JSON.stringify(j);
        if(j.available){
          document.getElementById('register').style.display = 'block';
        } else {
          document.getElementById('register').style.display = 'none';
        }
      }
      async function register(){
        const email = document.getElementById('email').value.trim();
        if(!email) return alert('enter email');
        const res = await fetch('/api/register', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ domain: lastDomain, ownerEmail: email }) });
        const j = await res.json();
        alert(JSON.stringify(j));
        loadDomains();
      }
      async function loadDomains(){
        const res = await fetch('/api/domains');
        const j = await res.json();
        const ul = document.getElementById('domains');
        ul.innerHTML = '';
        for(const d of j){
          const li = document.createElement('li');
          li.innerText = `${d.domain} — expires ${d.expiresAt}`;
          ul.appendChild(li);
        }
      }

      loadDomains();
    </script>
  </body>
</html>
